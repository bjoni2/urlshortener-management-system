<mat-toolbar class="shell-toolbar">
  <a class="brand" routerLink="/dashboard" aria-label="URL Shortener home">
    <mat-icon>link</mat-icon>
    <span class="brand-name">URL Shortener</span>
  </a>

  <nav class="shell-nav" aria-label="Main">
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
    <a mat-button routerLink="/urls" routerLinkActive="active-link">My URLs</a>
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin/users" routerLinkActive="active-link">Users</a>
      <a mat-button routerLink="/admin/urls" routerLinkActive="active-link">All URLs</a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
    <mat-icon>account_circle</mat-icon>
    <span class="account-email">{{ auth.user()?.email }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>
  <mat-menu #accountMenu="matMenu">
    <div class="account-summary" role="presentation">
      <div class="account-summary-email">{{ auth.user()?.email }}</div>
      <div class="account-summary-role">{{ auth.user()?.role }}</div>
    </div>
    <mat-divider />
    <button mat-menu-item (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
