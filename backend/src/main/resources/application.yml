spring:
  application:
    name: urlshortener

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urlshortener}
    password: ${DB_PASSWORD:urlshortener}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: always

  docker:
    compose:
      enabled: false
      file: ../docker-compose.yml
      lifecycle-management: start_only

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.urlshortener: INFO

app:
  cors:
    allowed-origins:
      - http://localhost:4200

  security:
    jwt:
      issuer: urlshortener
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    bootstrap-admin:
      enabled: true
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@urlshortener.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}

  short-url:
    base-url: ${SHORT_URL_BASE:http://localhost:8080/r}
    code-length: 7
    max-generation-attempts: 5
    default-ttl: 30d
    max-ttl: 3650d
    reserved-aliases:
      - api
      - r
      - actuator
      - swagger-ui
      - v3
      - admin
      - login
      - register
      - assets
      - favicon.ico
      - health

  expiration:
    cron: "0 */5 * * * *"
    purge-enabled: false
    purge-after: 30d
    batch-size: 500


---
spring:
  config:
    activate:
      on-profile: dev

  docker:
    compose:
      enabled: true

logging:
  level:
    com.urlshortener: DEBUG
    org.hibernate.SQL: DEBUG


---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: true

  docker:
    compose:
      enabled: false